    .sig-line { flex: 1; border-bottom: 1px solid #475569; padding-bottom: 4px; font-size: 0.75rem; color: var(--muted); }

    .modal-box { background: white; padding: 20px; border-radius: 8px; width: 100%; max-width: 440px; }
